<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1050" role="img" aria-labelledby="title desc">
<title id="title">Apple and Spotify: compare what each describes</title>
<desc id="desc">Apple describes show, channel, and episode names, popularity, and engagement from search as search factors. Spotify recommends clear titles and descriptions, accurate transcripts and chapter labels. Neither publishes a complete ranking formula. Compare keyword positions and listening reports separately; impressions are not plays.</desc>
<rect width="640" height="1050" rx="18" fill="#fcfaf5"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#292520">
<text x="32" y="52" font-size="29" font-weight="700">Two platforms,</text>
<text x="32" y="88" font-size="29" font-weight="700">different published guidance</text>
<text x="32" y="124" font-size="20" fill="#5e5852">Neither publishes a complete ranking formula.</text>
<rect x="32" y="153" width="576" height="252" rx="12" fill="#fff" stroke="#37312b" stroke-width="2"/>
<rect x="32" y="426" width="576" height="252" rx="12" fill="#fff" stroke="#37312b" stroke-width="2"/>
<rect x="32" y="700" width="576" height="280" rx="12" fill="#fff4e8" stroke="#dd6c20" stroke-width="2"/>
<circle cx="69" cy="194" r="15" fill="#df6a1f"/><text x="69" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
<text x="100" y="201" font-size="25" font-weight="700">Apple Podcasts search</text>
<text x="55" y="245" font-size="21"><tspan x="55">Apple names show, channel and episode</tspan><tspan x="55" dy="29">titles, popularity, and engagement</tspan><tspan x="55" dy="29">from search among its factors.</tspan></text>
<text x="55" y="364" font-size="19" fill="#5e5852">Charts and editorial features are separate.</text>
<circle cx="69" cy="467" r="15" fill="#df6a1f"/><text x="69" y="473" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
<text x="100" y="474" font-size="25" font-weight="700">Spotify creator guidance</text>
<text x="55" y="518" font-size="21"><tspan x="55">Spotify recommends clear titles and</tspan><tspan x="55" dy="29">descriptions, and accurate transcripts</tspan><tspan x="55" dy="29">and chapter labels.</tspan></text>
<text x="55" y="637" font-size="19" fill="#5e5852">Recommendations are not ranking weights.</text>
<circle cx="69" cy="741" r="15" fill="#df6a1f"/><text x="69" y="747" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
<text x="100" y="748" font-size="25" font-weight="700">Measure separately</text>
<text x="55" y="792" font-size="21"><tspan x="55">Compare positions for the same keyword</tspan><tspan x="55" dy="29">on each platform; read listening data</tspan><tspan x="55" dy="29">in the reports that provide it.</tspan></text>
<text x="55" y="927" font-size="20" font-weight="700"><tspan x="55">A search position or impression</tspan><tspan x="55" dy="27">does not identify a listener.</tspan></text>
</g></svg>
