<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 675" role="img" aria-labelledby="seasonal-title seasonal-desc">
<title id="seasonal-title">Plan a useful seasonal episode</title>
<desc id="seasonal-desc">Start with a relevant moment and audience question, review evidence of interest, work backward from when listeners need it, check availability after publishing, then compare equivalent reporting windows. No fixed lead time guarantees a result.</desc>
<rect x="1" y="1" width="418" height="673" rx="18" fill="#fffaf5" stroke="#e7d9cb" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#292420">
<text x="26" y="45" font-size="23" font-weight="700">A seasonal planning loop</text>
<text x="26" y="72" font-size="15" fill="#625b54">Work from your listener’s needs.</text>
<g fill="#fff" stroke="#d9cabd" stroke-width="1.5"><rect x="24" y="96" width="372" height="83" rx="11"/><rect x="24" y="198" width="372" height="83" rx="11"/><rect x="24" y="300" width="372" height="83" rx="11"/><rect x="24" y="402" width="372" height="83" rx="11"/><rect x="24" y="504" width="372" height="83" rx="11"/></g>
<g fill="#df6b1f"><circle cx="53" cy="123" r="15"/><circle cx="53" cy="225" r="15"/><circle cx="53" cy="327" r="15"/><circle cx="53" cy="429" r="15"/><circle cx="53" cy="531" r="15"/></g>
<g text-anchor="middle" font-size="15" font-weight="700" fill="#fff"><text x="53" y="128">1</text><text x="53" y="230">2</text><text x="53" y="332">3</text><text x="53" y="434">4</text><text x="53" y="536">5</text></g>
<g font-size="18" font-weight="700"><text x="79" y="129">Find a relevant moment</text><text x="79" y="231">Check evidence of interest</text><text x="79" y="333">Work backward from the need</text><text x="79" y="435">Publish and check availability</text><text x="79" y="537">Review comparable results</text></g>
<g font-size="15" fill="#514941"><text x="79" y="154">What question will listeners have?</text><text x="79" y="256">Past episodes, questions and trends</text><text x="79" y="358">Allow for production and promotion</text><text x="79" y="460">Confirm the episode on each platform</text><text x="79" y="562">Use the same episode age and window</text></g>
<g fill="none" stroke="#df6b1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M210 180v15m-5-5 5 5 5-5"/><path d="M210 282v15m-5-5 5 5 5-5"/><path d="M210 384v15m-5-5 5 5 5-5"/><path d="M210 486v15m-5-5 5 5 5-5"/></g>
<text x="26" y="621" font-size="15" fill="#625b54"><tspan x="26">No fixed lead time guarantees rankings.</tspan><tspan x="26" dy="22">Use what you learn to plan the next season.</tspan></text>
</g></svg>
