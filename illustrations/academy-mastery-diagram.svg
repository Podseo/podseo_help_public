<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 755" role="img" aria-labelledby="title desc">
<title id="title">Four parts of a podcast discovery strategy</title><desc id="desc">Study related shows, choose relevant keywords, apply those terms naturally to accurate content, then compare rankings and listening reports separately. Repeat the review as you learn.</desc>
<rect width="400" height="755" rx="16" fill="#fffaf4"/>
<text x="24" y="45" fill="#1d1b19" font-family="Arial, sans-serif" font-size="25" font-weight="700">Build, measure, revisit</text>
<text x="24" y="73" fill="#514b45" font-family="Arial, sans-serif" font-size="16">Four parts of a discovery strategy</text>
<g font-family="Arial, sans-serif" fill="#24201c">
<rect x="24" y="96" width="352" height="125" rx="12" fill="#fff" stroke="#dfd4c8" stroke-width="2"/>
<circle cx="54" cy="129" r="17" fill="#e86d24"/><text x="54" y="135" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">1</text>
<text x="82" y="135" font-size="19" font-weight="700">Explore related shows</text><text x="42" y="171" font-size="17"><tspan x="42">Note their topics, keywords</tspan><tspan x="42" dy="23">and gaps.</tspan></text>
<rect x="24" y="244" width="352" height="125" rx="12" fill="#fff" stroke="#dfd4c8" stroke-width="2"/>
<circle cx="54" cy="277" r="17" fill="#e86d24"/><text x="54" y="283" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">2</text>
<text x="82" y="283" font-size="19" font-weight="700">Choose relevant keywords</text><text x="42" y="319" font-size="17"><tspan x="42">Select terms for the show and</tspan><tspan x="42" dy="23">individual episodes.</tspan></text>
<rect x="24" y="392" width="352" height="125" rx="12" fill="#fff" stroke="#dfd4c8" stroke-width="2"/>
<circle cx="54" cy="425" r="17" fill="#e86d24"/><text x="54" y="431" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">3</text>
<text x="82" y="431" font-size="19" font-weight="700">Make content clear</text><text x="42" y="467" font-size="17"><tspan x="42">Use accurate, natural language</tspan><tspan x="42" dy="23">in titles and descriptions.</tspan></text>
<rect x="24" y="540" width="352" height="125" rx="12" fill="#fff" stroke="#dfd4c8" stroke-width="2"/>
<circle cx="54" cy="573" r="17" fill="#e86d24"/><text x="54" y="579" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">4</text>
<text x="82" y="579" font-size="19" font-weight="700">Review and adjust</text><text x="42" y="615" font-size="17"><tspan x="42">Compare rankings and listening</tspan><tspan x="42" dy="23">reports separately.</tspan></text>
</g>
<g stroke="#e86d24" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M200 221v21m-6-6 6 6 6-6"/><path d="M200 369v21m-6-6 6 6 6-6"/><path d="M200 517v21m-6-6 6 6 6-6"/></g>
<text x="200" y="701" fill="#514b45" font-family="Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="200">Revisit your choices as you learn</tspan><tspan x="200" dy="22">what changes.</tspan></text>
</svg>
