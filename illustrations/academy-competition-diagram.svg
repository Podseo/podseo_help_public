<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" role="img" aria-labelledby="title desc">
<title id="title">Turn competitor research into a testable idea</title>
<desc id="desc">Observe public titles, episode topics and rankings on each platform. Private downloads, retention and sources are not visible. Identify a relevant gap, check demand and test an idea with your audience, then review your own results.</desc>
<rect width="640" height="780" rx="20" fill="#fcfaf6"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#292520">
<text x="32" y="52" font-size="29" font-weight="700">From observation to action</text>
<text x="32" y="86" font-size="19" fill="#665d56">Compare what is visible, then test an idea.</text>
<rect x="32" y="110" width="576" height="173" rx="13" fill="#fff" stroke="#d8cbc0" stroke-width="2"/>
<circle cx="69" cy="150" r="17" fill="#e66c21"/><text x="69" y="156" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">1</text>
<text x="101" y="157" font-size="24" font-weight="700">Observe public signals</text>
<text x="52" y="198" font-size="20">Compare titles, episode topics and</text><text x="52" y="227" font-size="20">rankings for relevant keywords.</text>
<text x="52" y="259" font-size="18" fill="#665d56">Check each platform separately.</text>
<path d="M320 288v20m-7-7 7 7 7-7" stroke="#e66c21" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="316" width="576" height="166" rx="13" fill="#fff" stroke="#d8cbc0" stroke-width="2"/>
<circle cx="69" cy="356" r="17" fill="#e66c21"/><text x="69" y="362" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">2</text>
<text x="101" y="363" font-size="24" font-weight="700">Look for an opening</text>
<text x="52" y="404" font-size="20">Find a relevant topic or angle that</text><text x="52" y="433" font-size="20">others have not covered well.</text>
<text x="52" y="462" font-size="18" fill="#665d56">Check interest; a gap is not proof of demand.</text>
<path d="M320 487v20m-7-7 7 7 7-7" stroke="#e66c21" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="515" width="576" height="147" rx="13" fill="#fff" stroke="#d8cbc0" stroke-width="2"/>
<circle cx="69" cy="555" r="17" fill="#e66c21"/><text x="69" y="561" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">3</text>
<text x="101" y="562" font-size="24" font-weight="700">Test and review</text>
<text x="52" y="602" font-size="20">Try your own take; compare your</text><text x="52" y="631" font-size="20">rankings and audience feedback.</text>
<path d="M32 694h576" stroke="#e3d8cd" stroke-width="2"/>
<text x="32" y="725" font-size="18" font-weight="700">Keep in mind</text>
<text x="32" y="754" font-size="18" fill="#665d56">Competitors’ private downloads and retention are not visible.</text>
</g></svg>
