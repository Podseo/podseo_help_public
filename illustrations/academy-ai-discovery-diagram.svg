<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 690" role="img" aria-labelledby="title desc">
<title id="title">Three ways a listener can discover a podcast</title>
<desc id="desc">Podcast app search responds to a query. Personalized recommendations can appear without a search. An AI assistant responds to a conversational request, and its answers can vary. Each surface should be measured separately.</desc>
<rect width="480" height="690" rx="20" fill="#fffaf4"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#292520">
<text x="28" y="44" font-size="25" font-weight="700">Three discovery experiences</text>
<text x="28" y="72" font-size="16" fill="#615b55">One show can appear in different places.</text>
<g fill="#fff" stroke="#d9cec1" stroke-width="2"><rect x="28" y="96" width="424" height="151" rx="14"/><rect x="28" y="264" width="424" height="151" rx="14"/><rect x="28" y="432" width="424" height="151" rx="14"/></g>
<g fill="#e36c21"><circle cx="59" cy="130" r="15"/><circle cx="59" cy="298" r="15"/><circle cx="59" cy="466" r="15"/></g>
<g fill="#fff" font-size="15" text-anchor="middle" font-weight="700"><text x="59" y="135">1</text><text x="59" y="303">2</text><text x="59" y="471">3</text></g>
<g fill="#292520"><text x="86" y="136" font-size="21" font-weight="700">Podcast app search</text><text x="48" y="171" font-size="17"><tspan x="48">A listener types a query and sees</tspan><tspan x="48" dy="25">matching shows or episodes.</tspan></text>
<text x="86" y="304" font-size="21" font-weight="700">Personalized recommendations</text><text x="48" y="339" font-size="17"><tspan x="48">A listening app suggests content;</tspan><tspan x="48" dy="25">the listener may not have searched.</tspan></text>
<text x="86" y="472" font-size="21" font-weight="700">AI assistant answers</text><text x="48" y="507" font-size="17"><tspan x="48">A listener asks a question; answers</tspan><tspan x="48" dy="25">can vary with phrasing and context.</tspan></text></g>
<path d="M29 610h422" stroke="#e5d7ca" stroke-width="2"/><text x="28" y="643" font-size="16" font-weight="700">Review each surface separately.</text><text x="28" y="668" font-size="15" fill="#615b55">An AI mention is not a listener referral count.</text>
</g></svg>
